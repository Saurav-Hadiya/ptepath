<svg xmlns="http://www.w3.org/2000/svg" width="140" height="40" viewBox="0 0 140 40">
  <!-- Icon mark -->
  <rect x="0" y="0" width="40" height="40" rx="9" fill="#0F1B4C"/>
  <!-- P stem -->
  <rect x="11" y="9" width="5" height="22" rx="1.5" fill="#FFFFFF"/>
  <!-- P bowl top -->
  <rect x="16" y="9" width="9" height="5" rx="1" fill="#FFFFFF"/>
  <!-- P bowl bottom -->
  <rect x="16" y="19" width="9" height="5" rx="1" fill="#FFFFFF"/>
  <!-- P bowl right -->
  <rect x="22" y="14" width="5" height="10" rx="2.5" fill="#FFFFFF"/>
  <!-- Amber accent dot -->
  <circle cx="33" cy="30" r="3" fill="#F59E0B"/>

  <!-- Compact wordmark: PTE bold + PATH light inline -->
  <text x="50" y="26"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="20"
    font-weight="700"
    letter-spacing="-0.3"
    fill="#0F1B4C">PTE<tspan
      font-weight="300"
      letter-spacing="1.5">PATH</tspan></text>

  <!-- Amber dot accent after wordmark -->
  <circle cx="134" cy="22" r="3" fill="#F59E0B"/>
</svg>
